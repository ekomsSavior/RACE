[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-framework"
version = "0.1.0"
description = "RACE Bluetooth protocol research framework"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "click>=8.1", "colorama>=0.4"]

[tool.setuptools]
py-modules = ["race"]

[tool.setuptools.packages.find]
include = ["core*", "emulator*", "modules*", "transports*", "utils*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --cov=utils --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["utils"]
omit = ["utils/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["utils", "transports", "modules", "emulator", "race.py"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
